<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Pinned to card</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
  :root { --ink: #FFFFFF; --ink-soft: rgba(255,255,255,.72); --panel: rgba(20,20,18,.72); --accent: #7FA9D6; --accent-ink: #0F1A26; }
  * { box-sizing: border-box; }
  html { background: #000; }
  /* body must stay transparent: MindAR places the camera video behind the page content (z-index -2) */
  html, body { margin: 0; height: 100%; color: var(--ink); overflow: hidden;
    font-family: -apple-system, "SF Pro Text", "Segoe UI Variable", "Segoe UI", Roboto, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  body { position: relative; }
  a-scene { position: fixed; inset: 0; background: transparent; }
  a-scene canvas { background: transparent !important; }
  /* Do not restyle the camera <video>: MindAR positions it itself and aligns its rendering to that layout. */

  .ui { position: fixed; inset: 0; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; }
  .top { display: flex; align-items: center; justify-content: space-between; padding: calc(12px + env(safe-area-inset-top)) 14px 0; }
  .close { pointer-events: auto; width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--panel); color: var(--ink);
    font-size: 22px; line-height: 44px; text-align: center; text-decoration: none; backdrop-filter: blur(10px); }
  .close:focus-visible { outline: 2px solid var(--accent); }
  .name { background: var(--panel); backdrop-filter: blur(10px); padding: 8px 14px; border-radius: 999px; font-size: 15px; font-weight: 600; max-width: 60vw;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .status { align-self: center; background: var(--panel); backdrop-filter: blur(10px); padding: 10px 16px; border-radius: 999px; font-size: 14px; color: var(--ink-soft); }
  .status[hidden] { display: none; }

  .bottom { display: grid; gap: 10px; padding: 0 14px calc(16px + env(safe-area-inset-bottom)); }
  .scale { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; background: var(--panel); backdrop-filter: blur(10px); border-radius: 14px; padding: 10px 12px; pointer-events: auto; }
  .scale .readout { font-variant-numeric: tabular-nums; font-size: 15px; font-weight: 600; text-align: center; }
  .scale .readout small { display: block; font-weight: 400; font-size: 12px; color: var(--ink-soft); }
  .scale button { appearance: none; font: inherit; font-size: 14px; font-weight: 600; padding: 9px 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,.25);
    background: transparent; color: var(--ink); cursor: pointer; }
  .scale button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .hint { text-align: center; font-size: 12px; color: var(--ink-soft); }

  .error { position: fixed; inset: 0; display: grid; place-content: center; gap: 10px; padding: 32px; text-align: center; background: #1C1B19; }
  .error p { margin: 0; color: var(--ink-soft); max-width: 36ch; }
  .error a { color: var(--accent); }
</style>
</head>
<body>

<a-scene id="scene"
  mindar-image="imageTargetSrc: targets.mind; autoStart: true; uiLoading: no; uiScanning: no; uiError: no; filterMinCF: 0.00005; filterBeta: 0.001; warmupTolerance: 6; missTolerance: 8;"
  color-management="legacy" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false"
  renderer="colorManagement: true; physicallyCorrectLights: true; antialias: true; toneMapping: ACESFilmic; exposure: 1.1;">
  <a-camera position="0 0 0" look-controls="enabled: false" wasd-controls="enabled: false"></a-camera>
  <a-entity light="type: hemisphere; color: #ffffff; groundColor: #8a8a8a; intensity: 2.2"></a-entity>
  <a-entity light="type: directional; color: #fff6e8; intensity: 2.6" position="1.5 3 2.5"></a-entity>
  <a-entity light="type: directional; color: #dce8ff; intensity: 0.9" position="-2 1 -1.5"></a-entity>

  <a-entity id="target" mindar-image-target="targetIndex: 0">
    <!-- Faint outline the size of the printed card: confirms the tracking frame even if the model is off-screen. -->
    <a-plane width="1" height="1" color="#7FA9D6" opacity="0.18" transparent="true" side="double"></a-plane>
    <a-ring radius-inner="0.03" radius-outer="0.05" color="#7FA9D6" position="0 0 0.001"></a-ring>
    <!-- rotation 90° about X stands the model up out of the card (glTF is Y-up; the card plane is XY with Z toward the viewer). -->
    <a-entity id="rig" rotation="90 0 0">
      <a-entity id="gltf"></a-entity>
    </a-entity>
  </a-entity>
</a-scene>

<div class="ui">
  <div class="top">
    <a class="close" id="close" href="#" aria-label="Close and choose another mode">&#x2715;</a>
    <div class="name" id="name"></div>
  </div>
  <div class="status" id="status">Loading…</div>
  <div class="bottom">
    <div class="scale">
      <button type="button" id="fit">Fit to card</button>
      <div class="readout"><span id="ratio">1 : 1</span><small>pinch to resize</small></div>
      <button type="button" class="primary" id="one">1 : 1</button>
    </div>
    <div class="hint" id="hintline">Keep the whole printed card in view. Move the card, the model follows.</div>
  </div>
</div>

<script>
  const q = new URLSearchParams(location.search);
  const name = (q.get('model') || '').replace(/[^\w.-]/g, '');
  const title = q.get('title') || name.replace(/[-_]/g, ' ');
  const cardWidth = (parseFloat(q.get('card')) || 76.2) / 1000;  // printed width of the card in metres; default 3 in (76.2 mm)

  const back = new URL('index.html', location.href);
  if (name) back.searchParams.set('model', name);
  if (q.get('title')) back.searchParams.set('title', q.get('title'));
  document.getElementById('close').href = back.href;

  if (!name) {
    document.body.innerHTML = `<div class="error"><h1>No model selected</h1><p>Open this page with <code>?model=name</code>, or go back and pick a model.</p><a href="${back.href}">Back</a></div>`;
  } else {
    document.getElementById('name').textContent = title;
    document.title = title + ' on card';
    const modelUrl = name === 'astronaut' ? 'https://modelviewer.dev/shared-assets/models/Astronaut.glb' : `models/${name}.glb`;

    const status = document.getElementById('status');
    const rig = document.getElementById('rig');
    const gltf = document.getElementById('gltf');
    const ratioEl = document.getElementById('ratio');
    status.textContent = 'Loading model…';
    // Attach the model once the scene exists, so the component is guaranteed to see the URL.
    const scene = document.getElementById('scene');
    const attach = () => gltf.setAttribute('gltf-model', modelUrl);
    if (scene.hasLoaded) attach(); else scene.addEventListener('loaded', attach, { once: true });

    // In MindAR the card is 1 unit wide, so 1:1 means (1 / cardWidth) scene units per metre.
    const oneToOne = 1 / cardWidth;
    let largest = 1;        // largest model dimension in metres, set on load
    let modelInfo = '';
    let scale = oneToOne;   // current rig scale (scene units per metre)

    function applyScale(s) {
      scale = Math.min(Math.max(s, oneToOne / 500), oneToOne * 20);
      rig.object3D.scale.setScalar(scale);
      const r = scale / oneToOne;                        // 1 = real size
      ratioEl.textContent = r >= 0.995 && r <= 1.005 ? '1 : 1'
        : r > 1 ? `${r.toFixed(1)} : 1` : `1 : ${(1 / r).toFixed(1)}`;
    }
    function fitToCard() { applyScale(1 / largest * 0.8); }   // model's largest dimension = 80% of card width

    gltf.addEventListener('model-loaded', () => {
      const obj = gltf.object3D;
      // Measure in the model's own space by walking each mesh's local transforms up to the entity.
      // (No world-matrix inversion: MindAR keeps the card's matrix at all zeros until it is first seen.)
      const box = new THREE.Box3();
      const tmp = new THREE.Matrix4();
      obj.traverse((m) => {
        if (!m.isMesh || !m.geometry || !m.geometry.attributes.position) return;
        if (!m.geometry.boundingBox) m.geometry.computeBoundingBox();
        tmp.identity();
        for (let n = m; n && n !== obj; n = n.parent) { n.updateMatrix(); tmp.premultiply(n.matrix); }
        const b = m.geometry.boundingBox.clone().applyMatrix4(tmp);
        if (Number.isFinite(b.min.x) && Number.isFinite(b.max.x)) box.union(b);
      });
      if (box.isEmpty()) { status.textContent = 'Model loaded but its size could not be measured; showing it uncentred.'; applyScale(oneToOne); return; }
      const size = new THREE.Vector3(); box.getSize(size);
      const centre = new THREE.Vector3(); box.getCenter(centre);
      largest = Math.max(size.x, size.y, size.z) || 1;
      // Centre the model on the card and sit its base on the card surface (model space, before the rig rotation).
      obj.position.set(-centre.x, -box.min.y, -centre.z);
      // Always start at 1:1 with the exported file's units (model-viewer and the card share the same metres).
      applyScale(oneToOne);
      const cm = (v) => (v * 100).toFixed(1);
      modelInfo = `${cm(size.x)} × ${cm(size.y)} × ${cm(size.z)} cm`;
      status.textContent = `Model loaded (${modelInfo}). Point the camera at the printed card.`;
      if (largest * oneToOne > 30) status.textContent += ' Note: at 1:1 the model is over 30 cards wide; tap "Fit to card" if you cannot find it.';
    });
    gltf.addEventListener('model-error', (e) => { status.textContent = `Couldn't load ${modelUrl}`; console.error(e.detail); });

    const target = document.getElementById('target');
    let foundTimer;
    target.addEventListener('targetFound', () => {
      status.hidden = false; status.textContent = 'Card found';
      clearTimeout(foundTimer); foundTimer = setTimeout(() => { status.hidden = true; }, 1200);
    });
    target.addEventListener('targetLost', () => { status.hidden = false; status.textContent = 'Card lost. Point the camera at it again.'; });

    // MindAR's default far plane is ~10,000 target-pixels (under a metre for this card). Push it out.
    const extendFar = () => {
      const cam = scene.camera; if (!cam) return;
      cam.far = 200000; cam.updateProjectionMatrix();
    };
    scene.addEventListener('arReady', () => { extendFar(); setTimeout(extendFar, 500); });
    window.addEventListener('resize', () => setTimeout(extendFar, 300));

    scene.addEventListener('arError', () => {
      document.body.innerHTML = `<div class="error"><h1>Camera not available</h1><p>Open this link in Safari (iPhone) or Chrome (Android), not inside another app, and allow camera access.</p><a href="${back.href}">Back</a></div>`;
    });

    document.getElementById('one').addEventListener('click', () => applyScale(oneToOne));
    document.getElementById('fit').addEventListener('click', fitToCard);

    // Pinch to resize.
    let lastDist = null;
    const dist = (t) => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
    window.addEventListener('touchstart', (e) => { if (e.touches.length === 2) lastDist = dist(e.touches); }, { passive: false });
    window.addEventListener('touchmove', (e) => {
      if (e.touches.length === 2 && lastDist) {
        e.preventDefault();
        const d = dist(e.touches);
        applyScale(scale * d / lastDist);
        lastDist = d;
      }
    }, { passive: false });
    window.addEventListener('touchend', () => { lastDist = null; });

    if (q.get('debug')) {
      const h = document.getElementById('hintline');
      setInterval(() => {
        const p = gltf.object3D.position;
        const vis = target.object3D.visible;
        h.textContent = `model ${modelInfo || '…'} | rig scale ${scale.toFixed(2)} | offset ${p.x.toFixed(2)},${p.y.toFixed(2)},${p.z.toFixed(2)} | card ${vis ? 'tracked' : 'lost'}`;
      }, 500);
    }
  }
</script>
</body>
</html>
