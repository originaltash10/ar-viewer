<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AR viewer</title>
<meta name="description" content="View a 3D model in your space with AR.">
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
<style>
  :root {
    color-scheme: light dark;
    --bg: #E8E5DF;
    --sheet: #FBFAF8;
    --ink: #1F1E1B;
    --ink-soft: #6B675F;
    --line: #D5D1C9;
    --accent: #2F5D8A;
    --accent-ink: #FFFFFF;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #23221F;
      --sheet: #15140F;
      --ink: #EDEAE3;
      --ink-soft: #9C978D;
      --line: #35332E;
      --accent: #7FA9D6;
      --accent-ink: #0F1A26;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: -apple-system, "SF Pro Text", "Segoe UI Variable", "Segoe UI", Roboto, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; }
  body { display: flex; flex-direction: column; }

  model-viewer { flex: 1 1 auto; width: 100%; min-height: 0; background: var(--bg); --poster-color: var(--bg); }
  model-viewer::part(default-ar-button) { display: none; }
  model-viewer::part(default-progress-bar) { background: var(--accent); height: 3px; }

  .sheet {
    flex: 0 0 auto;
    background: var(--sheet);
    border-top: 1px solid var(--line);
    padding: 18px 20px calc(18px + env(safe-area-inset-bottom));
    display: grid; gap: 14px;
  }
  .meta { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
  .dims { margin: 0; font-size: 14px; color: var(--ink-soft); font-variant-numeric: tabular-nums; white-space: nowrap; }

  .segmented {
    display: grid; grid-template-columns: 1fr 1fr; gap: 4px;
    padding: 4px; border-radius: 12px; background: var(--bg); border: 1px solid var(--line);
  }
  .segmented button {
    appearance: none; border: 0; border-radius: 9px; padding: 10px 8px;
    background: transparent; color: var(--ink); font: inherit; font-size: 15px; font-weight: 500;
    cursor: pointer; transition: background .15s, color .15s;
  }
  .segmented button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  .segmented button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hint { margin: 0; font-size: 13px; color: var(--ink-soft); min-height: 1.2em; }

  .ar {
    appearance: none; border: 1px solid var(--ink); border-radius: 12px; padding: 14px;
    background: var(--ink); color: var(--sheet); font: inherit; font-size: 16px; font-weight: 600; cursor: pointer;
  }
  .ar:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .ar[hidden] { display: none; }
  .no-ar { margin: 0; font-size: 14px; color: var(--ink-soft); }

  .empty { flex: 1; display: grid; place-content: center; padding: 32px; text-align: center; gap: 8px; }
  .empty p { margin: 0; color: var(--ink-soft); max-width: 36ch; }
  .empty code { font-family: ui-monospace, Menlo, monospace; font-size: 14px; color: var(--ink); }
  @media (prefers-reduced-motion: reduce) { .segmented button { transition: none; } }
</style>
</head>
<body>

<model-viewer id="mv"
  ar ar-modes="scene-viewer quick-look webxr"
  ar-scale="auto" ar-placement="floor"
  camera-controls touch-action="pan-y"
  shadow-intensity="1" exposure="1"
  alt="3D model"></model-viewer>

<section class="sheet" id="sheet" hidden>
  <div class="meta">
    <h1 id="title">Model</h1>
    <p class="dims" id="dims"></p>
  </div>

  <div class="segmented" role="group" aria-label="Scale in AR">
    <button type="button" id="btn-free" aria-pressed="true">Free scale</button>
    <button type="button" id="btn-fixed" aria-pressed="false">Actual size</button>
  </div>
  <p class="hint" id="hint">Pinch to resize once it's placed in your space.</p>

  <button type="button" class="ar" id="ar">View in your space</button>
  <p class="no-ar" id="no-ar" hidden>AR isn't available in this browser. Open this page in Safari (iPhone) or Chrome (Android).</p>
</section>

<script type="module">
  const q = new URLSearchParams(location.search);
  const name = (q.get('model') || '').replace(/[^\w.-]/g, '');
  const mv = document.getElementById('mv');
  const sheet = document.getElementById('sheet');

  if (!name) {
    mv.remove();
    sheet.remove();
    document.body.insertAdjacentHTML('beforeend', `
      <div class="empty">
        <h1>No model selected</h1>
        <p>Add the model name to the address, for example <code>?model=chair</code>, and put <code>chair.glb</code> in the models folder.</p>
      </div>`);
  } else {
    const title = q.get('title') || name.replace(/[-_]/g, ' ');
    document.title = title + ' in AR';
    document.getElementById('title').textContent = title;
    mv.alt = title;
    mv.src = `models/${name}.glb`;
    mv.iosSrc = `models/${name}.usdz`;   // if the file doesn't exist, model-viewer converts the GLB on the fly
    sheet.hidden = false;

    // Scale mode: ?scale=fixed locks the model to 1:1 in AR; anything else allows pinch-to-resize.
    const btnFree = document.getElementById('btn-free');
    const btnFixed = document.getElementById('btn-fixed');
    const hint = document.getElementById('hint');
    const setScale = (mode) => {
      const fixed = mode === 'fixed';
      mv.setAttribute('ar-scale', fixed ? 'fixed' : 'auto');
      btnFree.setAttribute('aria-pressed', String(!fixed));
      btnFixed.setAttribute('aria-pressed', String(fixed));
      hint.textContent = fixed
        ? 'Placed at real-world size. Resizing is turned off.'
        : "Pinch to resize once it's placed in your space.";
      const url = new URL(location);
      url.searchParams.set('scale', fixed ? 'fixed' : 'free');
      history.replaceState(null, '', url);
    };
    btnFree.addEventListener('click', () => setScale('free'));
    btnFixed.addEventListener('click', () => setScale('fixed'));
    setScale(q.get('scale') === 'fixed' ? 'fixed' : 'free');

    // Real-world size readout, so you can confirm the export units came through correctly.
    mv.addEventListener('load', () => {
      const d = mv.getDimensions();          // metres
      const cm = (v) => (v * 100).toFixed(1);
      const inch = (v) => (v * 39.3701).toFixed(1);
      document.getElementById('dims').textContent =
        `${cm(d.x)} × ${cm(d.y)} × ${cm(d.z)} cm  ·  ${inch(d.x)} × ${inch(d.y)} × ${inch(d.z)} in`;
    });
    mv.addEventListener('error', () => {
      hint.textContent = `Couldn't load models/${name}.glb. Check the file name and that it was uploaded.`;
    });

    const arBtn = document.getElementById('ar');
    arBtn.addEventListener('click', () => mv.activateAR());
    if (!mv.canActivateAR) {
      mv.addEventListener('ar-status', (e) => { if (e.detail.status === 'failed') arBtn.hidden = true; });
      // canActivateAR is set once the component upgrades; re-check shortly after.
      setTimeout(() => {
        if (!mv.canActivateAR) { arBtn.hidden = true; document.getElementById('no-ar').hidden = false; }
      }, 1500);
    }
  }
</script>
</body>
</html>
