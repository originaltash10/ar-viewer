<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AR viewer</title>
<meta name="description" content="View a 3D model in your space with AR.">
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
<style>
  :root {
    color-scheme: light dark;
    --bg: #E8E5DF;
    --sheet: #FBFAF8;
    --ink: #1F1E1B;
    --ink-soft: #6B675F;
    --line: #D5D1C9;
    --accent: #2F5D8A;
    --accent-ink: #FFFFFF;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #23221F;
      --sheet: #15140F;
      --ink: #EDEAE3;
      --ink-soft: #9C978D;
      --line: #35332E;
      --accent: #7FA9D6;
      --accent-ink: #0F1A26;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: -apple-system, "SF Pro Text", "Segoe UI Variable", "Segoe UI", Roboto, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; }
  body { display: flex; flex-direction: column; }

  model-viewer { flex: 1 1 auto; width: 100%; min-height: 0; background: var(--bg); --poster-color: var(--bg); }
  model-viewer::part(default-ar-button) { display: none; }
  model-viewer::part(default-progress-bar) { background: var(--accent); height: 3px; }

  .sheet {
    flex: 0 0 auto;
    background: var(--sheet);
    border-top: 1px solid var(--line);
    padding: 18px 20px calc(18px + env(safe-area-inset-bottom));
    display: grid; gap: 14px;
  }
  .meta { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
  .dims { margin: 0; font-size: 14px; color: var(--ink-soft); font-variant-numeric: tabular-nums; white-space: nowrap; }

  .choices { display: grid; gap: 8px; }
  .choice {
    appearance: none; width: 100%; text-align: left; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px;
    padding: 13px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; cursor: pointer;
    text-decoration: none;
  }
  .choice strong { display: block; font-size: 15px; font-weight: 600; }
  .choice span { display: block; font-size: 13px; color: var(--ink-soft); margin-top: 2px; }
  .choice .go { font-size: 18px; color: var(--accent); }
  .choice:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .choice[hidden] { display: none; }
  .hint { margin: 0; font-size: 13px; color: var(--ink-soft); min-height: 1.2em; }

  .empty { flex: 1; display: grid; place-content: center; padding: 32px; text-align: center; gap: 8px; }
  .empty p { margin: 0; color: var(--ink-soft); max-width: 36ch; }
  .empty code { font-family: ui-monospace, Menlo, monospace; font-size: 14px; color: var(--ink); }
</style>
</head>
<body>

<model-viewer id="mv"
  ar ar-modes="scene-viewer quick-look webxr"
  ar-scale="auto" ar-placement="floor"
  camera-controls touch-action="pan-y"
  shadow-intensity="1" exposure="1"
  alt="3D model"></model-viewer>

<section class="sheet" id="sheet" hidden>
  <div class="meta">
    <h1 id="title">Model</h1>
    <p class="dims" id="dims"></p>
  </div>

  <div class="choices" id="choices" role="group" aria-label="How to view">
    <button type="button" class="choice" id="c-free"><div><strong>Place in your room</strong><span>Pinch to resize once placed</span></div><div class="go">&#x203A;</div></button>
    <button type="button" class="choice" id="c-fixed"><div><strong>Place at actual size</strong><span>Locked to real-world 1 : 1</span></div><div class="go">&#x203A;</div></button>
    <a class="choice" id="c-card"><div><strong>Pin to the printed card</strong><span>Follows the card as you move it</span></div><div class="go">&#x203A;</div></a>
  </div>
  <p class="hint" id="hint"></p>
</section>

<script type="module">
  const q = new URLSearchParams(location.search);
  const name = (q.get('model') || '').replace(/[^\w.-]/g, '');
  const mv = document.getElementById('mv');
  const sheet = document.getElementById('sheet');

  if (!name) {
    mv.remove();
    sheet.remove();
    document.body.insertAdjacentHTML('beforeend', `
      <div class="empty">
        <h1>No model selected</h1>
        <p>Add the model name to the address, for example <code>?model=chair</code>, and put <code>chair.glb</code> in the models folder.</p>
      </div>`);
  } else {
    const title = q.get('title') || name.replace(/[-_]/g, ' ');
    document.title = title + ' in AR';
    document.getElementById('title').textContent = title;
    mv.alt = title;
    mv.src = `models/${name}.glb`;
    mv.iosSrc = `models/${name}.usdz`;   // if the file doesn't exist, model-viewer converts the GLB on the fly
    sheet.hidden = false;

    const hint = document.getElementById('hint');
    const launch = (mode) => {
      mv.setAttribute('ar-scale', mode === 'fixed' ? 'fixed' : 'auto');
      mv.activateAR();
    };
    document.getElementById('c-free').addEventListener('click', () => launch('free'));
    document.getElementById('c-fixed').addEventListener('click', () => launch('fixed'));
    const card = new URL('tracked.html', location.href);
    card.searchParams.set('model', name);
    if (q.get('title')) card.searchParams.set('title', q.get('title'));
    if (q.get('card')) card.searchParams.set('card', q.get('card'));
    document.getElementById('c-card').href = card.href;

    // A QR code can preselect a mode with ?scale=free|fixed or ?mode=card; the chooser still shows so people can switch.
    const pre = q.get('mode') === 'card' ? 'card' : q.get('scale');
    if (pre === 'card') hint.textContent = 'This code is for the printed card. Tap the last option when the card is in front of you.';
    else if (pre) hint.textContent = pre === 'fixed' ? 'Suggested: place at actual size.' : 'Suggested: place in your room.';

    // Real-world size readout, so you can confirm the export units came through correctly.
    mv.addEventListener('load', () => {
      const d = mv.getDimensions();          // metres
      const cm = (v) => (v * 100).toFixed(1);
      const inch = (v) => (v * 39.3701).toFixed(1);
      document.getElementById('dims').textContent =
        `${cm(d.x)} × ${cm(d.y)} × ${cm(d.z)} cm  ·  ${inch(d.x)} × ${inch(d.y)} × ${inch(d.z)} in`;
    });
    mv.addEventListener('error', () => {
      hint.textContent = `Couldn't load models/${name}.glb. Check the file name and that it was uploaded.`;
    });

    // Native AR not available (desktop, or an in-app browser): hide the two placement options, keep the card option.
    setTimeout(() => {
      if (!mv.canActivateAR) {
        document.getElementById('c-free').hidden = true;
        document.getElementById('c-fixed').hidden = true;
        hint.textContent = 'Room placement needs Safari (iPhone) or Chrome (Android). The printed-card option works here if a camera is available.';
      }
    }, 1500);
  }
</script>
</body>
</html>
